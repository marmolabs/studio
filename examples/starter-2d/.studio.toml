verify = [
  ["cargo", "fmt", "--check"],
  ["cargo", "clippy", "--all-targets", "--", "-D", "warnings"],
  ["cargo", "test", "--locked"],
]
integration_branch = "main"

# Plays the game with scripted input and saves title.png, playing.png and
# game-over.png into {out}. Needs a desktop session.
capture = ["cargo", "run", "--release", "--", "--capture", "{out}"]
# Only changes to these files need a new capture.
capture_paths = ["src/**", "Cargo.toml"]
