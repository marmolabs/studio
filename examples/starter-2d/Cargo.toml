[package]
name = "starter-2d"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "Lantern: a tiny 2D Bevy sample game used as a target for AI coding agents"

# Empty table: keeps this package out of any parent workspace.
[workspace]

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["2d", "ui"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev.package."*"]
opt-level = 2
