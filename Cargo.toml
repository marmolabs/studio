[workspace]
members = [
    "crates/studio-core",
    "crates/studio-config",
    "crates/studio-git",
    "crates/studio-runtime",
    "crates/studio-store",
    "crates/studiod",
    "crates/studio",
    "crates/studio-web",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
license = "MIT"
repository = "https://github.com/marmolabs/studio"
homepage = "https://github.com/marmolabs/studio"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
globset = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
toml = { version = "0.8", features = ["display"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
