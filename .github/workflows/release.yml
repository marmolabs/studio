name: release

on:
  push:
    tags: ["v*"]
  # Pull requests that could break a release build it too, without publishing.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - install.sh
      - Cargo.lock
      - rust-toolchain.toml
      - "**/build.rs"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # Built on the arm runner; the toolchain cross-compiles for Intel.
          - target: x86_64-apple-darwin
            os: macos-latest
          # Built on the oldest Ubuntu offered, so the binaries need glibc 2.34
          # (the README says so); linked on 24.04 they needed 2.39.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "${{ matrix.target }}"
      - name: Read the version
        id: version
        run: |
          id="$(cargo pkgid --locked -p studio)"
          version="${id##*[#@]}"
          # The release notes come from the version's section of the changelog.
          if ! awk -v version="$version" '$1 == "##" && $2 == version { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the tag matches the version
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match studio $VERSION" >&2
            exit 1
          fi
      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}" -p studio -p studiod -p studio-web
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="studio-${VERSION}-${{ matrix.target }}"
          mkdir -p "$name/licenses"
          for bin in studio studiod studio-web; do
            cp "target/${{ matrix.target }}/release/$bin" "$name/"
          done
          cp LICENSE README.md CHANGELOG.md THIRD_PARTY.md "$name/"
          # studio-web carries these projects' files; see THIRD_PARTY.md.
          cp crates/studio-web/vendor/fonts/OFL.txt "$name/licenses/ibm-plex-OFL.txt"
          cp crates/studio-web/vendor/lucide/LICENSE "$name/licenses/lucide-LICENSE"
          cp crates/studio-web/vendor/datastar-LICENSE.md "$name/licenses/datastar-LICENSE.md"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-${{ matrix.target }}
          path: studio-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: studio-*
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum studio-*.tar.gz > SHA256SUMS
      - name: Take the notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            /^## / { if (found) exit; found = ($2 == version); next }
            found
          ' CHANGELOG.md > notes.md
          if ! grep -q . notes.md; then
            echo "the $version section of CHANGELOG.md is empty" >&2
            exit 1
          fi
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            dist/studio-*.tar.gz dist/SHA256SUMS
