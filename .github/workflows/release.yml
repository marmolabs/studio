name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # Built on the arm runner; the toolchain cross-compiles for Intel.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "${{ matrix.target }}"
      - name: Check the tag matches the crate version
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "studio"))')"
          if [ "$version" != "$crate" ]; then
            echo "tag $GITHUB_REF_NAME does not match studio $crate" >&2
            exit 1
          fi
      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}" -p studio -p studiod -p studio-web
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="studio-${version}-${{ matrix.target }}"
          mkdir "$name"
          for bin in studio studiod studio-web; do
            cp "target/${{ matrix.target }}/release/$bin" "$name/"
          done
          cp LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-${{ matrix.target }}
          path: studio-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: studio-*
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum studio-*.tar.gz > SHA256SUMS
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/studio-*.tar.gz dist/SHA256SUMS
